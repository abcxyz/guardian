name: 'ci'

on:
  push:
    branches:
      - 'main'
      - 'release/**/*'
  pull_request:
    branches:
      - 'main'
      - 'release/**/*'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  ABC_CLI_VERSION: '0.10.1'
  GUARDIAN_WIF_PROVIDER: 'projects/1098665030124/locations/global/workloadIdentityPools/guardian-automation/providers/guardian-ci-i'
  GUARDIAN_WIF_SERVICE_ACCOUNT: 'guardian-automation-bot@ghg-guardian-ci-i-6ad437.iam.gserviceaccount.com'
  GUARDIAN_BUCKET_NAME: 'guardian-ci-i-guardian-state-c79e1f4759'
  GUARDIAN_TERRAFORM_VERSION: '1.7.1'
  GUARDIAN_TAGREP_VERSION: '0.0.9'
  GUARDIAN_ALLOWED_PROVIDER_SOURCES: 'hashicorp/google,hashicorp/google-beta'

jobs:
  go_test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
          - 'windows-latest'
          - 'macos-latest'
    uses: 'abcxyz/actions/.github/workflows/go-test.yml@main' # ratchet:exclude
    with:
      runs-on: '"${{ matrix.os }}"'

  # Runs the full test suite with Terraform installed, so that tests that
  # exercise real Terraform (e.g. provisioner plugin discovery) run. The shared
  # go_test runners do not guarantee a terraform binary, so
  # GUARDIANTEST_REQUIRE_TERRAFORM makes those tests fail rather than skip.
  terraform_e2e:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # ratchet:actions/checkout@v4

      - name: 'Setup Go'
        uses: 'actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b' # ratchet:actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: 'Setup Terraform'
        uses: 'abcxyz/secure-setup-terraform@de9c26e6f9362048c4199f26a4bc8912f215c041' # ratchet:abcxyz/secure-setup-terraform@main
        with:
          terraform_version: '${{ env.GUARDIAN_TERRAFORM_VERSION }}'
          # Lint only the real modules; pkg/ contains intentional local-exec
          # test fixtures.
          terraform_module_location: './terraform'
          protect_lockfile: false
          terraform_wrapper: false

      - name: 'Test'
        shell: 'bash'
        run: |-
          go test \
            -count=1 \
            -coverprofile=./coverage.out \
            -race \
            -shuffle=on \
            ./...

      - name: 'Coverage'
        shell: 'bash'
        run: |-
          OUTPUT="$(go tool cover -func=./coverage.out)"
          TOTAL="$(echo "${OUTPUT}" | awk 'END{print $NF}')"
          tee -a "${GITHUB_STEP_SUMMARY}" > /dev/null <<EOF
            ## Coverage: ${TOTAL}

            \`\`\`text
            ${OUTPUT}
            \`\`\`
          EOF

  lint_templates:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # ratchet:actions/checkout@v4
        with:
          fetch-depth: 1 # shallow clone

      - name: 'Setup abc'
        uses: 'abcxyz/pkg/.github/actions/setup-binary@1d1cedf7768d17dde23bb2cda24bc1fb950e9f92' # ratchet:abcxyz/pkg/.github/actions/setup-binary@main
        with:
          download_url: 'https://github.com/abcxyz/abc/releases/download/v${{ env.ABC_CLI_VERSION }}/abc_${{ env.ABC_CLI_VERSION }}_linux_amd64.tar.gz'
          install_path: '${{ runner.temp }}/.abc'
          binary_subpath: 'abc'
          cache_key: '${{ runner.os }}_${{ runner.arch }}_abc_${{ env.ABC_CLI_VERSION }}'
          add_to_path: true

      - name: 'render templates'
        shell: 'bash'
        run: |
          rm -f ./.github/workflow/*
          abc templates render \
            -skip-manifest \
            -input=terraform_version="${GUARDIAN_TERRAFORM_VERSION}" \
            -input=tagrep_version="${GUARDIAN_TAGREP_VERSION}" \
            -input=guardian_wif_provider="${GUARDIAN_WIF_PROVIDER}" \
            -input=guardian_plan_service_account="${GUARDIAN_WIF_SERVICE_ACCOUNT}" \
            -input=guardian_apply_service_account="${GUARDIAN_WIF_SERVICE_ACCOUNT}" \
            -input=guardian_state_bucket="${GUARDIAN_BUCKET_NAME}" \
            -input=guardian_allowed_provider_sources="${GUARDIAN_ALLOWED_PROVIDER_SOURCES}" \
            -accept-defaults \
            ./abc.templates/base-workflows
          abc templates render \
            -skip-manifest \
            -input=gcp_organization_id="00000000" \
            -input=guardian_wif_provider="${GUARDIAN_WIF_PROVIDER}" \
            -input=guardian_service_account="${GUARDIAN_WIF_SERVICE_ACCOUNT}" \
            -accept-defaults \
            ./abc.templates/drift-workflows

      - name: 'lint ratchet'
        if: |
          always()
        uses: 'sethvargo/ratchet@main' # ratchet:exclude
        with:
          files: './.github/workflows/*.yml'

      - name: 'lint actions'
        if: |
          always()
        uses: 'abcxyz/actions/.github/actions/lint-github-actions@main' # ratchet:exclude

      - name: 'Verify golden tests base-workflows'
        if: |
          always()
        run: |
          abc golden-test verify ./abc.templates/base-workflows/

      - name: 'Verify golden tests drift-workflows'
        if: |
          always()
        run: |
          abc golden-test verify ./abc.templates/drift-workflows/
