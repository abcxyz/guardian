apiVersion: 'cli.abcxyz.dev/v1beta3'
kind: 'Template'

desc: 'Generate the default set of Guardian workflows Terraform infrastructure repositories.'

inputs:
  - name: 'terraform_directory'
    desc: 'A sub-directory for all Terraform files'
    default: '.'
  - name: 'terraform_version'
    desc: 'The Terraform version to use'
  - name: 'tagrep_version'
    desc: 'The Tagrep version to use. See https://github.com/abcxyz/tagrep/releases'
  - name: 'guardian_wif_provider'
    desc: 'The Google Cloud workload identity federation provider for Guardian'
  - name: 'guardian_plan_service_account'
    desc: 'The read-only Google Cloud service account for Guardian plan'
    rules:
      - rule: 'gcp_matches_service_account(guardian_plan_service_account)'
  - name: 'guardian_apply_service_account'
    desc: 'The read-write Google Cloud service account for Guardian apply and admin'
    rules:
      - rule: 'gcp_matches_service_account(guardian_apply_service_account)'
  - name: 'guardian_state_bucket'
    desc: 'The Google Cloud storage bucket for Guardian state'
  - name: 'guardian_allowed_provider_sources'
    desc: 'REQUIRED. The comma separated allowlist of Terraform provider sources that pull requests may use, in the form [HOSTNAME/]NAMESPACE/TYPE (e.g. "hashicorp/google,hashicorp/google-beta,integrations/github"). List the exact providers you trust; `terraform providers` and .terraform.lock.hcl show the ones in use. Providers from any other source are rejected before they are executed. There is no default because pull requests are untrusted: wildcards ("hashicorp/*", or a bare "*" for every provider) admit providers such as hashicorp/external, hashicorp/local and hashicorp/http that run arbitrary programs on the runner or exfiltrate its credentials, and must only be used in test environments.'
  - name: 'guardian_allowed_provisioner_sources'
    desc: 'The comma separated allowlist of Terraform provisioner sources, in the form [ORIGIN/]TYPE, where ORIGIN is "builtin" (file, local-exec, remote-exec) or "plugin" and defaults to "builtin" (e.g. "local-exec"). A bare "*" allows every provisioner. Provisioners are discouraged, and plugin provisioners should only be used for quick proofs of concept. If left blank, no provisioners are allowed.'
    default: ''
  - name: 'guardian_allowed_backend_attributes'
    desc: 'The comma separated allowlist of terraform backend types, and the attributes each may set, in the form TYPE/ATTRIBUTE (e.g. "gcs/bucket,gcs/prefix"). Use "cloud" as the type for HCP Terraform cloud blocks and dotted paths for nested blocks (e.g. "s3/assume_role.role_arn"). A backend type with no entries is not allowed, and allowed attributes must be static literal values. terraform init initializes the backend before any provider is checked, and attributes that set credentials, endpoints, file paths or identities can run commands or send the runner''s credentials elsewhere. "TYPE/*" allows every attribute of a backend type with any value, and a bare "*" allows every backend; only use these if you accept that risk, e.g. in test environments. The default covers the state location and locking attributes of gcs, s3 and azurerm; add entries for other backends. If left blank, no backends are allowed.'
    default: 'gcs/bucket,gcs/prefix,gcs/kms_encryption_key,s3/bucket,s3/key,s3/region,s3/dynamodb_table,s3/encrypt,s3/use_lockfile,s3/kms_key_id,azurerm/resource_group_name,azurerm/storage_account_name,azurerm/container_name,azurerm/key,azurerm/use_azuread_auth,azurerm/use_oidc'
  - name: 'guardian_report_threshold'
    desc: 'The number of changed entrypoints at which Guardian posts a single aggregated summary comment instead of one comment per directory.'
    default: '5'
    rules:
      - rule: 'int(guardian_report_threshold) > 0'
        message: 'must be a positive integer'

steps:
  - desc: 'Include required files and directories'
    action: 'include'
    params:
      paths:
        - 'contents/workflows'
        - 'contents/policies/guardian_admin_workflow_permissions.rego'
      as:
        - '.github/workflows'
        - 'policy/guardian/admin/workflow_permissions.rego'

  - desc: 'Replace variables'
    action: 'string_replace'
    params:
      paths:
        - '.github/workflows'
      replacements:
        - to_replace: 'REPLACE_TERRAFORM_DIRECTORY'
          with: '{{.terraform_directory}}'
        - to_replace: 'REPLACE_TERRAFORM_VERSION'
          with: '{{.terraform_version}}'
        - to_replace: 'REPLACE_TAGREP_VERSION'
          with: '{{.tagrep_version}}'
        - to_replace: 'REPLACE_GUARDIAN_WIF_PROVIDER'
          with: '{{.guardian_wif_provider}}'
        - to_replace: 'REPLACE_GUARDIAN_PLAN_WIF_SERVICE_ACCOUNT'
          with: '{{.guardian_plan_service_account}}'
        - to_replace: 'REPLACE_GUARDIAN_APPLY_WIF_SERVICE_ACCOUNT'
          with: '{{.guardian_apply_service_account}}'
        - to_replace: 'REPLACE_GUARDIAN_STATE_BUCKET'
          with: '{{.guardian_state_bucket}}'
        - to_replace: 'REPLACE_GUARDIAN_ALLOWED_PROVIDER_SOURCES'
          with: '{{.guardian_allowed_provider_sources}}'
        - to_replace: 'REPLACE_GUARDIAN_ALLOWED_PROVISIONER_SOURCES'
          with: '{{.guardian_allowed_provisioner_sources}}'
        - to_replace: 'REPLACE_GUARDIAN_ALLOWED_BACKEND_ATTRIBUTES'
          with: '{{.guardian_allowed_backend_attributes}}'
        - to_replace: 'REPLACE_GUARDIAN_REPORT_THRESHOLD'
          with: '{{.guardian_report_threshold}}'
        - to_replace: 'REPLACE_GUARDIAN_VERSION_TAG'
          with: '{{ trimPrefix ._git_tag "v" }}'

  # TODO: once https://github.com/abcxyz/abc/pull/423 is available, switch to a rule requiring a '_git_tag' value
  - desc: 'Print warning if rendered without git tag'
    action: 'print'
    if: '_git_tag == ""'
    params:
      message: |-
        #
        # WARNING ##############################
        #
        # The template was rendered without a valid git tag. For best compatibility, we recommended
        # re-rendering this template using one of the latest tags at https://github.com/abcxyz/guardian/tags.
        #
        ########################################
