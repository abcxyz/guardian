# Guardian apply is used to run the Terraform apply commands for a set of
# directories after a pull request has been merged.
name: 'guardian_apply'
run-name: 'guardian_apply - [REF ${{ github.ref_name }}]'

on:
  push:
    branches:
      - 'main'

# only one apply should run at a time
concurrency:
  group: '${{ github.workflow }}'

env:
  GUARDIAN_VERSION: 'REPLACE_GUARDIAN_VERSION_TAG'
  GUARDIAN_WIF_PROVIDER: 'REPLACE_GUARDIAN_WIF_PROVIDER'
  GUARDIAN_WIF_SERVICE_ACCOUNT: 'REPLACE_GUARDIAN_WIF_SERVICE_ACCOUNT'
  GUARDIAN_BUCKET_NAME: 'REPLACE_GUARDIAN_STATE_BUCKET'
  GUARDIAN_TERRAFORM_VERSION: 'REPLACE_TERRAFORM_VERSION'
  GUARDIAN_ALLOWED_PROVIDERS: 'REPLACE_GUARDIAN_ALLOWED_PROVIDERS'
  GUARDIAN_REPORT_THRESHOLD: 'REPLACE_GUARDIAN_REPORT_THRESHOLD'

jobs:
  init:
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      pull-requests: 'write'

    outputs:
      directories: '${{ steps.dirs.outputs.directories }}'
      threshold_exceeded: '${{ steps.dirs.outputs.threshold_exceeded }}'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # ratchet:actions/checkout@v4
        with:
          fetch-depth: 2 # required to get diff between HEAD and HEAD-1

      - name: 'Setup Guardian'
        uses: 'abcxyz/actions/.github/actions/setup-binary@4354d52e96a232b28734c3a0cc39266ecc3d52e8' # ratchet:abcxyz/actions/.github/actions/setup-binary@main
        with:
          download_url: 'https://github.com/abcxyz/guardian/releases/download/v${{ env.GUARDIAN_VERSION }}/guardian_${{ env.GUARDIAN_VERSION }}_linux_amd64.tar.gz'
          install_path: '${{ runner.temp }}/.guardian'
          binary_subpath: 'guardian'
          cache_key: '${{ runner.os }}_${{ runner.arch }}_guardian_${{ env.GUARDIAN_VERSION }}'
          add_to_path: true

      - name: 'Guardian Directories'
        id: 'dirs'
        shell: 'bash'
        env:
          # used to create comments on pull requests (access to only this repo)
          GUARDIAN_GITHUB_TOKEN: '${{ github.token }}'
        run: |-
          DIRECTORIES=$(guardian entrypoints -dir="REPLACE_TERRAFORM_DIRECTORY" -detect-changes -source-ref=HEAD~1 -dest-ref=HEAD)
          echo "entrypoints -> ${DIRECTORIES}"
          echo "directories=${DIRECTORIES}" >> "${GITHUB_OUTPUT}"

          if [ -z "${DIRECTORIES}" ] || [ "${DIRECTORIES}" == "[]" ]; then
            COUNT=0
          else
            COUNT=$(echo "${DIRECTORIES}" | jq 'length')
          fi
          echo "entrypoint count -> ${COUNT} (threshold ${GUARDIAN_REPORT_THRESHOLD})"

          if [ "${COUNT}" -ge "${GUARDIAN_REPORT_THRESHOLD}" ]; then
            echo "threshold_exceeded=true" >> "${GITHUB_OUTPUT}"
          else
            echo "threshold_exceeded=false" >> "${GITHUB_OUTPUT}"
          fi

  apply:
    if: |
      needs.init.outputs.directories != '[]'
    needs:
      - 'init'
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'

    strategy:
      fail-fast: false
      max-parallel: 100
      matrix:
        working_directory: '${{ fromJSON(needs.init.outputs.directories) }}'

    env:
      DIRECTORY: '${{ matrix.working_directory }}'
      GITHUB_JOB_NAME: '${{ github.job }} (${{ matrix.working_directory }})'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # ratchet:actions/checkout@v4

      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f' # ratchet:google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.GUARDIAN_WIF_PROVIDER }}'
          service_account: '${{ env.GUARDIAN_WIF_SERVICE_ACCOUNT }}'

      - name: 'Setup Terraform'
        uses: 'abcxyz/secure-setup-terraform@de9c26e6f9362048c4199f26a4bc8912f215c041' # ratchet:abcxyz/secure-setup-terraform@main
        with:
          terraform_version: '${{ env.GUARDIAN_TERRAFORM_VERSION }}'
          terraform_module_location: './${{ matrix.working_directory }}'
          terraform_lockfile_location: './${{ matrix.working_directory }}'
          protect_lockfile: true
          terraform_wrapper: false

      - name: 'Setup Guardian'
        uses: 'abcxyz/actions/.github/actions/setup-binary@4354d52e96a232b28734c3a0cc39266ecc3d52e8' # ratchet:abcxyz/actions/.github/actions/setup-binary@main
        with:
          download_url: 'https://github.com/abcxyz/guardian/releases/download/v${{ env.GUARDIAN_VERSION }}/guardian_${{ env.GUARDIAN_VERSION }}_linux_amd64.tar.gz'
          install_path: '${{ runner.temp }}/.guardian'
          binary_subpath: 'guardian'
          cache_key: '${{ runner.os }}_${{ runner.arch }}_guardian_${{ env.GUARDIAN_VERSION }}'
          add_to_path: true

      - name: 'Guardian Apply'
        shell: 'bash'
        env:
          # used to create comments on pull requests (access to only this repo)
          GUARDIAN_GITHUB_TOKEN: '${{ github.token }}'
          THRESHOLD_EXCEEDED: '${{ needs.init.outputs.threshold_exceeded }}'
        run: |-
          if [ "${THRESHOLD_EXCEEDED}" = "true" ]; then
            guardian apply -dir="${DIRECTORY}" -storage="gcs://${GUARDIAN_BUCKET_NAME}" -allowed-providers="${GUARDIAN_ALLOWED_PROVIDERS}" -skip-reporting=true
          else
            guardian apply -dir="${DIRECTORY}" -storage="gcs://${GUARDIAN_BUCKET_NAME}" -allowed-providers="${GUARDIAN_ALLOWED_PROVIDERS}"
          fi

  aggregator:
    if: |
      always() && needs.init.outputs.threshold_exceeded == 'true'
    needs:
      - 'init'
      - 'apply'
    runs-on: 'ubuntu-latest'

    permissions:
      actions: 'read'
      pull-requests: 'write'

    steps:
      - name: 'Setup Guardian'
        uses: 'abcxyz/actions/.github/actions/setup-binary@4354d52e96a232b28734c3a0cc39266ecc3d52e8' # ratchet:abcxyz/actions/.github/actions/setup-binary@main
        with:
          download_url: 'https://github.com/abcxyz/guardian/releases/download/v${{ env.GUARDIAN_VERSION }}/guardian_${{ env.GUARDIAN_VERSION }}_linux_amd64.tar.gz'
          install_path: '${{ runner.temp }}/.guardian'
          binary_subpath: 'guardian'
          cache_key: '${{ runner.os }}_${{ runner.arch }}_guardian_${{ env.GUARDIAN_VERSION }}'
          add_to_path: true

      - name: 'Aggregate results and post comment'
        shell: 'bash'
        env:
          GUARDIAN_GITHUB_TOKEN: '${{ github.token }}'
          OUTPUTS_DIRECTORIES: '${{ needs.init.outputs.directories }}'
        run: |-
          guardian workflows report \
            -type="apply" \
            -entrypoints="${OUTPUTS_DIRECTORIES}"
